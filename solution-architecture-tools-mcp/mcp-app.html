<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solution Architecture Tools</title>
    <style>
      :root {
        --violet: #6c5ce7;
        --violet-h: #5a4bd6;
        --violet-light: #f5f3ff;
        --dark: #0f0f1e;
        --gray-2: #3c3c58;
        --gray-4: #8a8aa8;
        --gray-6: #c8c8dc;
        --border: #eaeaf4;
        --bg-input: #fafafe;
        --bg-canvas: #efeff5;
      }
      body { margin:0; padding:20px; background:var(--bg-canvas); color:var(--dark); font-family:"DM Sans", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #app { min-height: 80vh; }
      .shell { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
      .card { background:#fff; border:1.5px solid var(--border); border-radius:14px; padding:14px; }
      h1 { margin:0 0 8px; font-family:"Syne","DM Sans",sans-serif; font-size:28px; font-weight:600; letter-spacing:-1px; }
      .meta { color:var(--gray-4); font-size:12px; margin-bottom:10px; }
      textarea { width:100%; min-height:500px; border:1.5px solid var(--border); background:var(--bg-input); border-radius:12px; padding:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
      textarea:focus { outline:none; border-color:var(--violet); box-shadow:0 0 0 3px rgba(108,92,231,.09); }
      .actions { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
      button { height:38px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg-input); color:#3c3c58; padding:0 12px; font-weight:600; cursor:pointer; }
      button:hover { border-color:var(--violet); color:var(--violet); background:var(--violet-light); transition:.15s; }
      .primary { background:var(--violet); color:#fff; border-color:var(--violet); }
      .primary:hover { background:var(--violet-h); color:#fff; border-color:var(--violet-h); }
      .preview { min-height:560px; border:1.5px solid var(--border); border-radius:12px; overflow:auto; background:#fff; }
      .preview img { width:100%; height:auto; display:block; }
      .warn { margin-top:8px; color:#8a8aa8; font-size:12px; }
      .rules { margin:0; padding-left:16px; font-size:12px; color:var(--gray-2); }
      @media (max-width: 980px) { .shell { grid-template-columns:1fr; } textarea { min-height:300px; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mcp-app.tsx"></script>
  </body>
</html>
