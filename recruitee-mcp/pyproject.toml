[project]
name = "recruitee-mcp"
version = "0.1.0"
description = "Recruitee MCP service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "fastapi-mcp>=0.3",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
  "python-dotenv>=1.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
