<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recruitee MCP App</title>
    <style>
      :root {
        --violet: #6c5ce7;
        --violet-h: #5a4bd6;
        --violet-light: #f5f3ff;
        --violet-mid: #eeeaff;
        --dark: #0f0f1e;
        --gray-2: #3c3c58;
        --gray-3: #6a6a88;
        --gray-4: #8a8aa8;
        --gray-5: #aaaabe;
        --gray-6: #c8c8dc;
        --border: #eaeaf4;
        --bg-input: #fafafe;
        --bg-canvas: #efeff5;
        --success: #00c98d;
        --error: #ef4444;
      }

      body {
        margin: 0;
        padding: 20px;
        background: var(--bg-canvas);
        color: var(--dark);
        font-family: "DM Sans", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .panel-card {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 14px;
        padding: 16px;
      }

      .panel-head h3 {
        margin: 0;
        font-family: "Syne", "DM Sans", Arial, sans-serif;
        font-size: 37px;
        font-weight: 600;
        letter-spacing: -1.6px;
        line-height: 1.1;
      }

      .panel-head p,
      .helper {
        margin: 8px 0 0;
        font-size: 12px;
        font-weight: 500;
        color: var(--gray-4);
      }

      .table-wrap {
        margin-top: 12px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      th,
      td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-size: 14px;
      }

      th {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--gray-3);
        background: var(--bg-input);
      }

      .opening-row {
        cursor: pointer;
        transition: background 0.15s;
        outline: none;
      }

      .opening-row:hover {
        background: #faf9ff;
      }

      .opening-row.selected {
        background: var(--violet-light);
      }

      .status-chip {
        display: inline-flex;
        padding: 5px 10px;
        border-radius: 999px;
        border: 1.5px solid var(--border);
        background: var(--bg-input);
        color: var(--gray-3);
        font-size: 12px;
        font-weight: 600;
      }

      .opening-row:focus-visible,
      .candidate-card:focus-visible,
      .stage-column:focus-visible {
        box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.09);
        border-color: var(--violet);
      }

      .detail-card {
        margin-top: 12px;
        padding: 14px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        background: var(--bg-input);
        font-size: 14px;
      }

      .detail-card h4 {
        margin: 0 0 10px 0;
        font-family: "Syne", "DM Sans", Arial, sans-serif;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.8px;
        line-height: 1.2;
      }

      .detail-card div {
        color: var(--gray-2);
        margin-top: 3px;
      }

      .kanban-wrap {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        margin-top: 10px;
        padding-bottom: 8px;
      }

      .stage-column {
        min-width: 270px;
        max-width: 270px;
        border: 1.5px solid var(--border);
        border-radius: 14px;
        background: var(--bg-input);
        padding: 10px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      .stage-column.drop-target {
        border-color: var(--violet);
        box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.09);
      }

      .stage-head {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--gray-3);
        margin-bottom: 8px;
      }

      .stage-cards {
        min-height: 32px;
      }

      .candidate-card {
        border: 1.5px solid var(--border);
        border-radius: 12px;
        background: #fff;
        padding: 10px;
        margin-bottom: 8px;
        cursor: grab;
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      }

      .candidate-card:hover {
        border-color: #c8c0f8;
      }

      .candidate-card.dragging {
        opacity: 0.6;
        transform: translateY(-1px);
      }

      .candidate-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--dark);
        letter-spacing: -0.3px;
      }

      .candidate-email,
      .candidate-meta {
        font-size: 12px;
        color: var(--gray-4);
        margin-top: 3px;
      }

      .stage-empty {
        font-size: 12px;
        color: var(--gray-6);
      }
    </style>
  </head>
  <body>
    <div id="app">Loading Recruitee app...</div>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
