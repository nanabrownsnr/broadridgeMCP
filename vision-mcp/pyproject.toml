[project]
name = "vision-mcp"
version = "0.1.0"
description = "Vision MCP service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "fastapi-mcp>=0.3",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "pillow>=10.0",
  "pypdfium2>=4.30",
  "rapidocr-onnxruntime>=1.3.24"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
